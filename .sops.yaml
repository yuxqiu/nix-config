keys:
  - &yuxqiu 
  - &cedrus 
  - &dracaena 
creation_rules:
  - path_regex: profiles/hosts/cedrus/secrets/[^/]+\.(yaml|json|env|ini)$
    key_groups:
      - age:
          - *yuxqiu
          - *cedrus
  - path_regex: profiles/hosts/dracaena/secrets/[^/]+\.(yaml|json|env|ini)$
    key_groups:
      - age:
          - *yuxqiu
          - *dracaena
